<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOGSYSTEM — Suivi des trains en temps réel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg: #0a0a0b;
    --bg-panel: #141416;
    --rail: #b31217;
    --rail-bright: #ff3b3b;
    --text: #f2f0ed;
    --text-dim: #8a8a8e;
    --ok: #3ddc84;
    --warn: #ffb020;
    --line: #232326;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  ::selection{background:var(--rail);color:#fff;}

  .hero{
    position:relative;min-height:44vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:50px 24px;overflow:hidden;border-bottom:1px solid var(--line);
  }
  .rails-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:0.9;}
  .rail-line{stroke:var(--rail-bright);stroke-width:3;fill:none;filter:drop-shadow(0 0 8px rgba(255,59,59,0.6));}
  .rail-tie{stroke:#5a1418;stroke-width:2;}
  .blip{fill:var(--rail-bright);filter:drop-shadow(0 0 6px var(--rail-bright));}
  .hero-content{position:relative;z-index:2;text-align:center;max-width:720px;width:100%;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;letter-spacing:.25em;text-transform:uppercase;font-size:12px;color:var(--rail-bright);margin-bottom:18px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(38px,8vw,72px);letter-spacing:.03em;margin:0 0 14px;line-height:0.95;text-transform:uppercase;}
  h1 span{color:var(--rail-bright);}
  .tagline{color:var(--text-dim);font-size:16px;margin:0 0 30px;line-height:1.5;}

  .search-bar{display:flex;align-items:center;gap:10px;background:var(--bg-panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;max-width:480px;margin:0 auto;transition:border-color .2s;}
  .search-bar:focus-within{border-color:var(--rail);}
  .search-bar input{background:none;border:none;outline:none;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;width:100%;}
  .search-bar input::placeholder{color:var(--text-dim);}

  .wrap{max-width:1000px;margin:0 auto;padding:36px 24px 60px;}

  .status-panel{
    background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;
    padding:22px 24px;margin-bottom:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  }
  .status-left{display:flex;align-items:center;gap:12px;}
  .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2s infinite;}
  .dot.err{background:var(--rail-bright);box-shadow:0 0 8px var(--rail-bright);}
  .dot.loading{background:var(--warn);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .status-title{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:14px;}
  .status-sub{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);margin-top:2px;}
  .status-count{font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:600;text-align:right;}
  .status-count small{display:block;font-size:11px;color:var(--text-dim);font-weight:400;letter-spacing:.05em;}

  .panel-title{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--text-dim);margin-bottom:16px;}

  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:13px;}
  th{text-align:left;color:var(--text-dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;text-transform:uppercase;letter-spacing:.04em;}
  td{padding:10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tr.passed{opacity:0.45;}
  tr.current td:first-child{color:var(--rail-bright);font-weight:600;}
  .station-name{font-family:'Inter',sans-serif;font-weight:500;}
  .delay-ok{color:var(--ok);}
  .delay-warn{color:var(--warn);}
  .delay-bad{color:var(--rail-bright);}

  #map{width:100%;height:360px;border-radius:6px;border:1px solid var(--line);margin-bottom:24px;background:#0a0a0b;}
  #map .leaflet-tile-pane{filter:invert(92%) hue-rotate(180deg) brightness(0.95) contrast(0.9);}

  .composition-panel{background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:24px;}
  .composition-units{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .unit-card{
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 14px;
    font-family:'IBM Plex Mono',monospace;font-size:12px;min-width:110px;
  }
  .unit-card .num{font-size:15px;font-weight:600;color:var(--rail-bright);}
  .unit-card .type{color:var(--text-dim);margin-top:2px;}

  .back-link{
    display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--text-dim);
    text-decoration:none;margin-bottom:16px;cursor:pointer;
  }
  .back-link:hover{color:var(--rail-bright);}

  footer{padding:26px 28px;text-align:center;color:var(--text-dim);font-size:12px;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;border-top:1px solid var(--line);}
</style>
</head>
<body>

  </svg>
  <div class="hero-content">
    <div class="eyebrow">Réseau ferroviaire belge · En direct</div>
    <h1>DOG<span>SYSTEM</span></h1>
    <p class="tagline">Tapez un numéro de train pour voir sa position en direct, ou une gare pour voir les prochains passages.</p>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Ex: 517, ou Bruxelles-Central…" />

<div class="wrap">

  <div class="status-panel">
    <div class="status-left">
      <span class="dot loading" id="statusDot"></span>
      <div>
        <div class="status-title" id="statusTitle">Connexion à l'API SNCB…</div>
        <div class="status-sub" id="statusSub">—</div>
      </div>
    </div>
    <div class="status-count">
      <span id="tripCount">–</span>
      <small id="tripCountLabel">arrêts en direct</small>
    </div>
  </div>

  <div id="resultsArea">
    <div class="panel-title">Chargement des données en direct…</div>
  </div>

</div>

<footer>DOG SYSTEM BY W</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let stationInfo = {};        // stop_id -> { name, lat, lon }
let trainNumbers = {};        // trip_id (static, exact) -> vrai numéro de train
let trainNumbersByPrefix = {};// trip_id (static, sans le dernier segment) -> vrai numéro de train
let allRows = [];             // toutes les mises à jour à plat
let leafletMap = null;

async function loadStations() {
  try {
    const res = await fetch('/api/stations');
    const data = await res.json();
    if (res.ok) stationInfo = data;
  } catch (err) {
    console.error('Erreur chargement des gares', err);
  }
}

async function loadTrips() {
  try {
    const res = await fetch('/api/trips');
    const data = await res.json();
    if (res.ok) {
      trainNumbers = data;
      trainNumbersByPrefix = {};
      for (const key in trainNumbers) {
        const lastColon = key.lastIndexOf(':');
        if (lastColon > -1) {
          trainNumbersByPrefix[key.substring(0, lastColon)] = trainNumbers[key];
        }
      }
    }
  } catch (err) {
    console.error('Erreur chargement des numéros de train', err);
  }
}

function stationName(stopId) {
  const s = stationInfo[stopId];
  return (s && s.name) || stopId || '—';
}

function stationCoord(stopId) {
  const s = stationInfo[stopId];
  if (s && typeof s.lat === 'number' && typeof s.lon === 'number' && !isNaN(s.lat) && !isNaN(s.lon)) {
    return [s.lat, s.lon];
  }
  return null;
}

function extractTrainNumber(rawTripId) {
  const id = String(rawTripId);
  if (trainNumbers[id]) return { number: trainNumbers[id], matched: true };
  if (trainNumbersByPrefix[id]) return { number: trainNumbersByPrefix[id], matched: true };
  const parts = id.split(':');
  const maybeNumber = parts[parts.length - 2];
  if (maybeNumber && /^\d+$/.test(maybeNumber)) return { number: maybeNumber, matched: false };
  return { number: id, matched: false };
}

async function loadTripUpdates() {
  const dot = document.getElementById('statusDot');
  const title = document.getElementById('statusTitle');
  const sub = document.getElementById('statusSub');

  try {
    const res = await fetch('/api/trip-updates');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Erreur inconnue');

    const entities = data.entity || [];
    allRows = [];

    entities.forEach(e => {
      const tu = e.trip_update || e.tripUpdate;
      if (!tu) return;
      const trip = tu.trip || {};
      const rawTripId = trip.trip_id || trip.tripId || '—';
      const extracted = extractTrainNumber(rawTripId);
      const stopUpdates = tu.stop_time_update || tu.stopTimeUpdate || [];

      stopUpdates.forEach((stu, idx) => {
        const stopId = stu.stop_id || stu.stopId || '—';
        const arrival = stu.arrival || {};
        const departure = stu.departure || {};
        const delaySec = arrival.delay ?? departure.delay ?? 0;
        const time = arrival.time || departure.time || null; // timestamp Unix (secondes)
        const seq = stu.stop_sequence ?? stu.stopSequence ?? idx;

        allRows.push({
          tripId: extracted.number,
          rawTripId,
          stopId,
          seq,
          time,
          delayMin: Math.round(delaySec / 60)
        });
      });
    });

    dot.className = 'dot ok';
    title.textContent = 'Connecté — flux en direct';
    sub.textContent = 'Dernière mise à jour : ' + new Date().toLocaleTimeString('fr-BE');

    render();
  } catch (err) {
    dot.className = 'dot err';
    title.textContent = 'Connexion impossible';
    sub.textContent = String(err.message || err);
    document.getElementById('resultsArea').innerHTML =
      '<div class="panel-title" style="color:var(--rail-bright);">Erreur de chargement.</div>';
  }
}

function delayInfo(min) {
  if (min > 5) return { cls: 'delay-bad', label: '+' + min + ' min' };
  if (min > 0) return { cls: 'delay-warn', label: '+' + min + ' min' };
  return { cls: 'delay-ok', label: "À l'heure" };
}

function formatTime(unixSeconds) {
  if (!unixSeconds) return '—';
  return new Date(unixSeconds * 1000).toLocaleTimeString('fr-BE', { hour: '2-digit', minute: '2-digit' });
}

function render() {
  const query = document.getElementById('searchInput').value.trim();
  const queryLower = query.toLowerCase();
  const countEl = document.getElementById('tripCount');
  const countLabel = document.getElementById('tripCountLabel');
  const area = document.getElementById('resultsArea');

  const looksLikeTrainNumber = /^\d+$/.test(query);
  const matchingTrainRows = looksLikeTrainNumber
    ? allRows.filter(r => String(r.tripId) === query)
    : [];

  if (looksLikeTrainNumber && matchingTrainRows.length > 0) {
    countLabel.textContent = 'arrêts sur ce trajet';
    countEl.firstChild.textContent = matchingTrainRows.length;
    renderTrainView(query, matchingTrainRows, area, false);
    return;
  }

  if (looksLikeTrainNumber && query.length > 0) {
    countLabel.textContent = 'arrêts sur ce trajet';
    countEl.firstChild.textContent = '–';
    renderScheduledTrainView(query, area);
    return;
  }

  // Sinon : vue liste classique (par gare, ou tout si recherche vide)
  let rows = allRows;
  if (queryLower) {
    rows = rows.filter(r => stationName(r.stopId).toLowerCase().includes(queryLower));
  }
  countLabel.textContent = 'arrêts affichés';
  countEl.firstChild.textContent = rows.length;
  renderListView(rows, area);
}

function renderListView(rows, area) {
  let html = '<div class="panel-title">Prochains passages en direct</div>';
  html += `<table><thead><tr><th>Gare</th><th>N° Train</th><th>Retard</th></tr></thead><tbody>`;

  if (rows.length === 0) {
    html += `<tr><td colspan="3" style="color:var(--text-dim);">Aucun résultat.</td></tr>`;
  } else {
    rows.slice(0, 40).forEach(r => {
      const d = delayInfo(r.delayMin);
      html += `<tr><td class="station-name">${stationName(r.stopId)}</td><td>${r.tripId}</td><td class="${d.cls}">${d.label}</td></tr>`;
    });
  }

  html += `</tbody></table>`;
  area.innerHTML = html;
}

function gtfsTimeToUnix(hms, referenceDate) {
  if (!hms) return null;
  const parts = hms.split(':').map(Number);
  const h = parts[0] || 0, m = parts[1] || 0, s = parts[2] || 0;
  const d = new Date(referenceDate);
  d.setHours(0, 0, 0, 0);
  d.setSeconds(d.getSeconds() + h * 3600 + m * 60 + s);
  return d.getTime() / 1000;
}

async function loadComposition(trainNumber) {
  const panel = document.getElementById('compositionPanel');
  if (!panel) return;

  try {
    const res = await fetch('/api/composition?number=' + encodeURIComponent(trainNumber));
    const data = await res.json();

    if (!res.ok || !data.units || data.units.length === 0) {
      panel.innerHTML = `<div class="panel-title" style="margin-bottom:8px;">Composition du train</div>
        <div style="color:var(--text-dim);font-size:12px;">${data.error || 'Composition non disponible pour ce train.'}</div>`;
      return;
    }

    let html = `<div class="panel-title" style="margin-bottom:8px;">Composition du train — ${data.units.length} voiture(s)</div>`;
    html += `<div class="composition-units">`;
    data.units.forEach(u => {
      html += `<div class="unit-card">
        <div class="num">n° ${u.materialNumber || '—'}</div>
        <div class="type">${u.type || 'Type inconnu'}</div>
        <div class="type">${u.seatsFirstClass}× 1ère · ${u.seatsSecondClass}× 2nde</div>
        ${u.hasBikeSection ? '<div class="type">🚲 Espace vélos</div>' : ''}
      </div>`;
    });
    html += `</div>`;
    panel.innerHTML = html;
  } catch (err) {
    panel.innerHTML = `<div style="color:var(--text-dim);font-size:12px;">Composition indisponible pour le moment.</div>`;
  }
}

async function renderScheduledTrainView(trainNumber, area) {
  area.innerHTML = `<div class="panel-title">Recherche de l'horaire du train ${trainNumber}…</div>`;
  try {
    const res = await fetch('/api/train?number=' + encodeURIComponent(trainNumber));
    const data = await res.json();

    if (!res.ok) {
      area.innerHTML = `
        <a class="back-link" onclick="document.getElementById('searchInput').value='';render();">← Retour</a>
        <div class="panel-title">Train n° ${trainNumber}</div>
        <div style="color:var(--text-dim);font-size:13px;">${data.error || 'Aucune information trouvée pour ce train.'}</div>`;
      return;
    }

    const today = new Date();
    const rows = data.stops.map(s => ({
      tripId: trainNumber,
      stopId: s.stopId,
      seq: s.seq,
      time: gtfsTimeToUnix(s.departureTime || s.arrivalTime, today),
      delayMin: 0
    }));

    renderTrainView(trainNumber, rows, area, true);
  } catch (err) {
    area.innerHTML = `<div class="panel-title" style="color:var(--rail-bright);">Erreur : ${String(err.message || err)}</div>`;
  }
}

function renderTrainView(trainNumber, rows, area, isScheduleOnly) {
  const sorted = rows.slice().sort((a, b) => (a.seq ?? 0) - (b.seq ?? 0));
  const now = Date.now() / 1000;

  // Trouve le dernier arrêt déjà passé et le prochain arrêt à venir.
  let lastPassedIdx = -1;
  for (let i = 0; i < sorted.length; i++) {
    if (sorted[i].time && sorted[i].time <= now) lastPassedIdx = i;
  }
  const nextIdx = lastPassedIdx + 1 < sorted.length ? lastPassedIdx + 1 : -1;

  // Estime la position actuelle (interpolation entre le dernier arrêt passé et le prochain).
  let estimatedPos = null;
  if (lastPassedIdx >= 0 && nextIdx >= 0) {
    const a = sorted[lastPassedIdx], b = sorted[nextIdx];
    const coordA = stationCoord(a.stopId), coordB = stationCoord(b.stopId);
    if (coordA && coordB && a.time && b.time && b.time > a.time) {
      const fraction = Math.min(1, Math.max(0, (now - a.time) / (b.time - a.time)));
      estimatedPos = [
        coordA[0] + (coordB[0] - coordA[0]) * fraction,
        coordA[1] + (coordB[1] - coordA[1]) * fraction
      ];
    } else if (coordA) {
      estimatedPos = coordA;
    }
  } else if (lastPassedIdx >= 0) {
    estimatedPos = stationCoord(sorted[lastPassedIdx].stopId);
  } else if (sorted.length > 0) {
    estimatedPos = stationCoord(sorted[0].stopId);
  }

  let html = `<a class="back-link" onclick="document.getElementById('searchInput').value='';render();">← Retour à la liste des gares</a>`;
  html += `<div class="panel-title">Train n° ${trainNumber} — trajet en direct</div>`;
  if (isScheduleOnly) {
    html += `<div style="color:var(--text-dim);font-size:13px;margin-bottom:16px;">
      Aucun retard signalé pour ce train actuellement — horaire théorique affiché (position estimée en supposant qu'il roule à l'heure).
    </div>`;
  }
  html += `<div id="map"></div>`;
  html += `<table><thead><tr><th>Gare</th><th>Heure</th><th>Retard</th></tr></thead><tbody>`;

  sorted.forEach((r, i) => {
    const d = delayInfo(r.delayMin);
    let rowClass = '';
    if (i <= lastPassedIdx) rowClass = 'passed';
    else if (i === nextIdx) rowClass = 'current';
    html += `<tr class="${rowClass}"><td class="station-name">${stationName(r.stopId)}</td><td>${formatTime(r.time)}</td><td class="${d.cls}">${d.label}</td></tr>`;
  });

  html += `</tbody></table>`;
  html += `<div class="composition-panel" id="compositionPanel"><div class="panel-title" style="margin-bottom:8px;">Composition du train (voitures)</div><div style="color:var(--text-dim);font-size:12px;">Recherche en cours…</div></div>`;
  area.innerHTML = html;

  loadComposition(trainNumber);

  // Construction de la carte
  if (leafletMap) { leafletMap.remove(); leafletMap = null; }
  const mapEl = document.getElementById('map');
  if (!mapEl) return;

  const coords = sorted.map(r => stationCoord(r.stopId)).filter(Boolean);
  if (coords.length === 0) return;

  leafletMap = L.map('map', { attributionControl: false });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { subdomains: 'abc', maxZoom: 19 }).addTo(leafletMap);

  L.polyline(coords, { color: '#b31217', weight: 3, opacity: 0.7 }).addTo(leafletMap);

  sorted.forEach((r, i) => {
    const c = stationCoord(r.stopId);
    if (!c) return;
    const isPassed = i <= lastPassedIdx;
    L.circleMarker(c, {
      radius: 5,
      color: isPassed ? '#5a5a5e' : '#f2f0ed',
      fillColor: isPassed ? '#5a5a5e' : '#f2f0ed',
      fillOpacity: 0.9,
      weight: 1
    }).addTo(leafletMap).bindPopup(stationName(r.stopId));
  });

  if (estimatedPos) {
    L.circleMarker(estimatedPos, {
      radius: 9,
      color: '#ff3b3b',
      fillColor: '#ff3b3b',
      fillOpacity: 1,
      weight: 2
    }).addTo(leafletMap).bindPopup('Position estimée du train ' + trainNumber);
  }

  leafletMap.fitBounds(coords, { padding: [30, 30] });
}

document.getElementById('searchInput').addEventListener('input', render);

async function init() {
  await loadStations();
  await loadTrips();
  await loadTripUpdates();
  setInterval(loadTripUpdates, 30000);
}
init();
</script>
